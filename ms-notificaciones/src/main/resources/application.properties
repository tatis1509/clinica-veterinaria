spring.application.name=ms-notificaciones
server.port=${PORT:8082}

# ---- PostgreSQL ----
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notificaciones_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:tatis0915}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# ---- Email por SMTP: por defecto Mailpit (docker run -d -p 8025:8025 -p 1025:1025 axllent/mailpit) ----
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=${MAIL_SMTP_AUTH:false}
spring.mail.properties[mail.smtp.starttls.enable]=${MAIL_STARTTLS:false}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
notification.email.from=${MAIL_FROM:notificaciones@veterinaria.local}
# Brevo (gratis, recomendado en Render): MAIL_HOST=smtp-relay.brevo.com MAIL_PORT=2525
#   MAIL_USERNAME / MAIL_PASSWORD (clave SMTP de Brevo) MAIL_SMTP_AUTH=true MAIL_STARTTLS=true

# ---- SMS con Twilio: estos valores NO se escriben aqui, van como variables de entorno ----
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}
# Cuenta Trial: Twilio solo permite plantillas predefinidas (error 572006). Si ocurre, se reintenta con esta plantilla.
twilio.trial-template=${TWILIO_TRIAL_TEMPLATE:sms_order_confirmation}

management.endpoints.web.exposure.include=health,info
