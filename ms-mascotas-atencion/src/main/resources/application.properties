spring.application.name=ms-mascotas-atencion
server.port=${PORT:8081}

# ---- URLs de los otros microservicios (en Render: https://ms-duenos-pagos-xxxx.onrender.com) ----
duenos.service.url=${DUENOS_SERVICE_URL:http://localhost:8080}
notificaciones.service.url=${NOTIFICACIONES_SERVICE_URL:http://localhost:8082}
http.client.connect-timeout-ms=3000
http.client.read-timeout-ms=10000

# ---- API externa de IA: Google Gemini (crear la key gratis en https://aistudio.google.com/apikey) ----
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# Carga los 5 tipos de atencion iniciales si la tabla esta vacia
mascotas.seed.enabled=true

# ---- PostgreSQL ----
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mascotas_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:tatis0915}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

management.endpoints.web.exposure.include=health,info
