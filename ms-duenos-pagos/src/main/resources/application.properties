spring.application.name=ms-duenos-pagos
# En Render la variable PORT la pone la plataforma
server.port=${PORT:8080}

# ---- PostgreSQL: valores locales por defecto, en Render se pasan por variables de entorno ----
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:duenos_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:tatis0915}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# ---- Salud del servicio (Render la usa como health check) ----
management.endpoints.web.exposure.include=health,info
